<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Researcher Dashboard | Like Hero To Zero</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<main class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <a th:href="@{/}" class="text-decoration-none">
      ← Back to public dashboard
    </a>

    <form th:action="@{/logout}" method="post">
      <button type="submit" class="btn btn-outline-danger">
        Log out
      </button>
    </form>
  </div>

  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4 p-md-5">

      <div th:if="${successMessage}"
           class="alert alert-success"
           th:text="${successMessage}">
      </div>

      <h1 class="mb-3">Researcher Dashboard</h1>
      <p class="text-muted mb-4">
        Manage country emission records and maintain historical CO₂ data.
      </p>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0">Emission records</h2>

        <div class="d-flex align-items-center gap-3">
                    <span class="badge bg-success"
                          th:text="${#lists.size(emissionRecords)} + ' records'">
                        0 records
                    </span>

          <a th:href="@{/researcher/emissions/new}"
             class="btn btn-success">
            Add record
          </a>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
          <tr>
            <th scope="col">Country</th>
            <th scope="col">Year</th>
            <th scope="col" class="text-end">CO₂ emissions (kt)</th>
            <th scope="col" class="text-end">Actions</th>
          </tr>
          </thead>

          <tbody>
          <tr th:each="record : ${emissionRecords}">
            <td th:text="${record.country.name}">Germany</td>
            <td th:text="${record.year}">2023</td>
            <td class="text-end"
                th:text="${#numbers.formatDecimal(record.emissionsKt, 1, 'COMMA', 3, 'POINT')}">
              565,000.000
            </td>
            <td>
              <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/researcher/emissions/{id}/edit(id=${record.id})}"
                   class="btn btn-sm btn-outline-success">
                  Edit
                </a>

                <form th:action="@{/researcher/emissions/{id}/delete(id=${record.id})}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this emission record?');">
                  <button type="submit"
                          class="btn btn-sm btn-outline-danger">
                    Delete
                  </button>
                </form>
              </div>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(emissionRecords)}">
            <td colspan="4" class="text-center text-muted py-4">
              No emission records available.
            </td>
          </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</main>

</body>
</html>
