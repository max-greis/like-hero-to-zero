<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Emission Record | Like Hero To Zero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<main class="container py-5">
    <div class="mb-4">
        <a th:href="@{/researcher}" class="text-decoration-none">
            ← Back to researcher dashboard
        </a>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4 p-md-5">

            <h1 class="mb-3"
                th:text="${recordId != null} ? 'Edit emission record' : 'Add emission record'">
                Add emission record
            </h1>

            <p class="text-muted mb-4"
               th:text="${recordId != null}
                   ? 'Update the annual CO₂ emission value for this record.'
                   : 'Enter a new annual CO₂ emission value for a country.'">
                Enter a new annual CO₂ emission value for a country.
            </p>

            <form th:action="${recordId != null}
                    ? @{/researcher/emissions/{id}(id=${recordId})}
                    : @{/researcher/emissions}"
                  th:object="${emissionRecordForm}"
                  method="post">

                <div th:if="${formError}"
                     class="alert alert-danger"
                     th:text="${formError}">
                    Unable to save the emission record.
                </div>

                <div th:if="${#fields.hasAnyErrors()}"
                     class="alert alert-danger">
                    Please correct the highlighted fields.
                </div>

                <div class="mb-3">
                    <label for="countryId" class="form-label">
                        Country
                    </label>

                    <select id="countryId"
                            th:field="*{countryId}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('countryId')} ? 'is-invalid' : ''"
                            required>
                        <option value="">Select a country</option>
                        <option th:each="country : ${countries}"
                                th:value="${country.id}"
                                th:text="${country.name}">
                        </option>
                    </select>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('countryId')}"
                         th:errors="*{countryId}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="year" class="form-label">
                        Reporting year
                    </label>

                    <input type="number"
                           id="year"
                           th:field="*{year}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('year')} ? 'is-invalid' : ''"
                           min="1750"
                           max="2100"
                           placeholder="e.g. 2024"
                           required>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('year')}"
                         th:errors="*{year}">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="emissionsKt" class="form-label">
                        CO₂ emissions (kt)
                    </label>

                    <input type="number"
                           id="emissionsKt"
                           th:field="*{emissionsKt}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('emissionsKt')} ? 'is-invalid' : ''"
                           min="0"
                           step="0.001"
                           placeholder="e.g. 550000.000"
                           required>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('emissionsKt')}"
                         th:errors="*{emissionsKt}">
                    </div>

                    <div class="form-text">
                        Enter the value in kilotonnes, using up to three decimal places.
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit"
                            class="btn btn-success"
                            th:text="${recordId != null} ? 'Save changes' : 'Save emission record'">
                        Save emission record
                    </button>

                    <a th:href="@{/researcher}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>
</main>

</body>
</html>
